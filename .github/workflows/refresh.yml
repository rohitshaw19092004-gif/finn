# Daily after NSE close (16:15 IST = 10:45 UTC, Mon–Fri): pull EOD prices, filings and
# fundamentals, classify/score/enrich, write the snapshot, commit it. pages.yml then redeploys.
name: refresh-snapshot
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Restore LLM + document cache (filings never change; re-runs cost ~0 tokens)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: finn-cache-${{ github.run_id }}
          restore-keys: finn-cache-
      - name: Refresh
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m finn refresh
      - name: Save cache (even if the job partly failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: finn-cache-${{ github.run_id }}
      - name: Commit snapshot
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "snapshot $(date -u +%F)"
          git pull --rebase
          git push
